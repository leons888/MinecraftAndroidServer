plugins { id 'com.android.application' }

android {
    namespace 'com.bdscontrol.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bdscontrol.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    // libbox64.so is a prebuilt ARM64 executable shipped as a native library.
    // It must not be stripped and must be extracted to nativeLibraryDir, which is
    // the only app-owned directory Android (API 29+) still allows exec() from.
    packagingOptions {
        doNotStrip '*/arm64-v8a/*.so'
    }

    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.9'
}
