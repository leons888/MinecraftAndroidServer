name: Build runtime artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runtime-build.yml'
      - 'runtime-build/**'

permissions:
  contents: read

jobs:
  box64-android-arm64:
    name: Build Box64 Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y git cmake make python3 patchelf binutils file
      - name: Fetch Android NDK r26b
        run: |
          set -euo pipefail
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -qq android-ndk-r26b-linux.zip
          echo "BOX64_COMPILER=$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV
      - name: Clone official Box64 source
        run: git clone --depth 1 --branch v0.4.2 https://github.com/ptitSeb/box64.git runtime-build/box64
      - name: Select Linux guest entrypoint on Android host
        working-directory: runtime-build/box64
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/emu/entrypoint.c')
          s = p.read_text()
          old = '#ifdef ANDROID\nvoid EXPORT my___libc_init'
          new = '#if 0\nvoid EXPORT my___libc_init'
          if s.count(old) != 1:
              raise SystemExit(f'unexpected entrypoint markers: {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          grep -n -A1 -B1 'my___libc_start_main' src/emu/entrypoint.c
      - name: Configure Box64 for Android host with Linux guest startup
        working-directory: runtime-build/box64
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_C_COMPILER="$BOX64_COMPILER" \
            -DANDROID=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1 -DTERMUX=0 \
            -DCI=0 -DZYDIS3=0 -DHAVE_TRACE=0 -DSTATICBUILD=0 -DBOX32=0 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: runtime-build/box64
        run: cmake --build build --parallel $(nproc)
      - name: Verify Linux guest startup wrapper is in binary
        working-directory: runtime-build/box64
        run: |
          set -euo pipefail
          test -f build/box64
          readelf -Ws build/box64 | grep -q 'my___libc_start_main'
          readelf -Ws build/box64 | grep -q 'my___libc_init' && ! readelf -Ws build/box64 | grep 'my___libc_init' || true
      - name: Package, verify and hash
        run: |
          set -euo pipefail
          install -Dm755 runtime-build/box64/build/box64 runtime-build/out/libbox64.so
          install -Dm755 runtime-build/box64/build/box64 runtime-build/out/box64-android-arm64
          file runtime-build/out/libbox64.so
          readelf -h runtime-build/out/libbox64.so
          readelf -Ws runtime-build/out/libbox64.so | grep -q 'my___libc_start_main'
          sha256sum runtime-build/out/libbox64.so runtime-build/out/box64-android-arm64 | tee runtime-build/out/box64-android-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: box64-android-arm64
          path: |
            runtime-build/out/libbox64.so
            runtime-build/out/box64-android-arm64*
