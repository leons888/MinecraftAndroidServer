name: Publish verified runtime assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update
        required: true
        default: runtime-v1
  push:
    paths:
      - '.github/workflows/runtime-build.yml'
      - 'runtime-build/**'
    branches: [ main ]
  tags: ['runtime-v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/runtime-build.yml
    secrets: inherit

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.ref, 'refs/tags/runtime-v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'box64-android-arm64'
          path: release-assets
          merge-multiple: true
      - name: Validate ELF and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/libbox64.so
          file release-assets/libbox64.so | grep -Eq 'ELF 64-bit LSB (pie )?executable, ARM aarch64'
          readelf -h release-assets/libbox64.so | tee release-assets/libbox64.readelf.txt
          readelf -d release-assets/libbox64.so | tee release-assets/libbox64.dynamic.txt
          (cd release-assets && sha256sum libbox64.so | tee SHA256SUMS)
          grep -Eq '^[0-9a-fA-F]{64}  libbox64\.so$' release-assets/SHA256SUMS
      - name: Publish patched runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'runtime-v1' }}
          name: Runtime patched Box64 Android
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            release-assets/libbox64.so
            release-assets/SHA256SUMS
            release-assets/libbox64.readelf.txt
            release-assets/libbox64.dynamic.txt
