name: Publish verified runtime assets

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish successful build outputs as a GitHub Release
        required: true
        default: 'false'
  push:
    tags: ['runtime-v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/runtime-build.yml
    secrets: inherit

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/runtime-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-aarch64*'
          path: release-assets
          merge-multiple: true
      - name: Validate artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/proot-aarch64
          test -s release-assets/box64-android-arm64
          file release-assets/proot-aarch64
          file release-assets/box64-android-arm64
          sha256sum release-assets/proot-aarch64 release-assets/box64-android-arm64 | tee release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Runtime ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
