name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle/gradle-8.2/bin/gradle" --version
      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-build.log
      - name: Surface the real compilation errors
        if: failure()
        run: |
          { echo '## Build failed'; echo '```'; grep -nE 'error:|FAILURE:|What went wrong|Execution failed' /tmp/gradle-build.log | head -n 80 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify native packaging contract
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libbox64.so'
          unzip -p "$APK" lib/arm64-v8a/libbox64.so > /tmp/libbox64.so
          file /tmp/libbox64.so | grep -Eq 'ELF 64-bit LSB (pie )?executable, ARM aarch64'
          grep -q 'android:extractNativeLibs="true"' app/src/main/AndroidManifest.xml
          echo 'libbox64.so is packaged and Android extraction is enabled'
      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftAndroidServer-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Write build summary
        run: |
          echo '## APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo '- Artifact: MinecraftAndroidServer-debug-${{ github.run_number }}' >> "$GITHUB_STEP_SUMMARY"
