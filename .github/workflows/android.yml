name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.2/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle/gradle-8.2/bin/gradle" --version

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-build.log

      - name: Surface the real compilation errors
        if: failure()
        run: |
          {
            echo '## Build failed'
            echo ''
            echo '```'
            grep -nE 'error:|FAILURE:|What went wrong|Execution failed' /tmp/gradle-build.log | head -n 80 || echo 'No javac/Gradle error lines matched; see the uploaded log.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify libbox64.so is packaged uncompressed
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import sys
          from zipfile import ZIP_STORED, ZipFile
          apk = sys.argv[1]
          with ZipFile(apk) as zf:
              info = zf.getinfo('lib/arm64-v8a/libbox64.so')
              if info.compress_type != ZIP_STORED:
                  raise SystemExit('libbox64.so is compressed; Android cannot exec it from nativeLibraryDir')
              if info.file_size == 0:
                  raise SystemExit('libbox64.so is empty')
          PY
          unzip -p "$APK" lib/arm64-v8a/libbox64.so > /tmp/libbox64.so
          file /tmp/libbox64.so | grep -Eq 'ELF 64-bit LSB (pie )?executable, ARM aarch64'
          grep -q 'android:extractNativeLibs="true"' app/src/main/AndroidManifest.xml
          echo 'libbox64.so is present, uncompressed, and an AArch64 ELF executable'

      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftAndroidServer-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        run: |
          {
            echo '## APK ready'
            echo ''
            echo '- Download artifact: `MinecraftAndroidServer-debug-${{ github.run_number }}`'
            echo '- File: `app-debug.apk`'
            echo '- Install on Poco X4 GT after extracting the artifact ZIP.'
          } >> "$GITHUB_STEP_SUMMARY"
