name: Build debug APK

on:
  workflow_dispatch:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
permissions: { contents: read }
jobs:
  build-runtime:
    uses: ./.github/workflows/runtime-build.yml
    secrets: inherit
  build-debug-apk:
    needs: build-runtime
    name: Build debug APK with patched Box64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download Box64 built for this commit
        uses: actions/download-artifact@v4
        with:
          name: box64-android-arm64
          path: app/build/generated/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.2/bin" >> "$GITHUB_PATH"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle-build.log
      - name: Verify APK output and native packaging
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libbox64.so'
          unzip -p "$APK" lib/arm64-v8a/libbox64.so > /tmp/libbox64.so
          file /tmp/libbox64.so | grep -Eq 'ELF 64-bit LSB (pie )?executable, ARM aarch64'
          grep -q 'android:extractNativeLibs="true"' app/src/main/AndroidManifest.xml
      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftAndroidServer-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
