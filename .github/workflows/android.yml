name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain --warning-mode all
      - name: Print concise build diagnostics
        if: steps.assemble.outcome == 'failure'
        run: |
          echo '=== Gradle failure markers ==='
          grep -RInE 'error:|FAILURE:|What went wrong|Caused by:' . --include='*.log' --include='*.txt' 2>/dev/null | tail -80 || true
          echo '=== Source inventory ==='
          find app/src/main/java -type f -name '*.java' -print | sort
          exit 1
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftAndroidServer-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Write build summary
        run: |
          {
            echo '## APK ready'
            echo ''
            echo '- Download artifact: `MinecraftAndroidServer-debug-${{ github.run_number }}`'
            echo '- File: `app-debug.apk`'
            echo '- Install on Poco X4 GT after extracting the artifact ZIP.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
